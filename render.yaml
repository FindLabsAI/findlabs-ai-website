services:
  - type: web
    name: findlabs-ai-employee
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
      - key: NOTIFICATION_EMAIL
        value: founder@findlabs.org
    disk:
      name: employee-requests
      mountPath: /var/data
      sizeGB: 1
